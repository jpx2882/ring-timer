<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ring Timer</title>
<meta name="description" content="Boxing & workout interval timer: Warm up, Training, Rest, Stretching.">
<meta name="theme-color" content="#0b0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ring Timer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bangers";src:url("fonts/Bangers-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Russo One";src:url("fonts/RussoOne-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url("fonts/BarlowCondensed-SemiBold.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:800;src:url("fonts/BarlowCondensed-ExtraBold.ttf") format("truetype");font-display:swap}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
.app{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<style>
/* Layout: one-screen fight HUD — mode banner, giant timer in a ring, quick presets, big START, mode tabs pinned at the bottom. Single dark look by choice. */
:root{
  color-scheme: dark;
  --ink:#0b0a0f;          /* page */
  --panel:#16141d;        /* raised surfaces */
  --line:#2a2733;
  --text:#f4f1fa;
  --muted:#8d88a0;
  --warmup:#ff8c1a;       /* jaune orangé */
  --training:#e8202f;     /* rouge */
  --rest:#ffd21f;         /* jaune */
  --stretch:#2f8bff;      /* bleu */
  --mode:var(--training);
  --g1:#fff36b; --g2:#ff9a1f; --g3:#e0161f;   /* text fill gradient (palette) */
  --stroke:#1a0505;
  --font-display:"Bangers","Impact","Arial Black",sans-serif;
  --font-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --skew:-7deg;
}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:var(--font-ui); font-weight:600;
  overflow:hidden; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
body[data-font="iron"]{ --font-display:"Russo One","Arial Black",sans-serif; --skew:0deg }

.app{
  height:100%; display:flex; flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% 38%, color-mix(in srgb,var(--mode) 32%, transparent), transparent 70%),
    var(--ink);
  transition:background .4s;
}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex; align-items:center; justify-content:flex-end; padding-block:10px 0}
.brand{font-family:var(--font-display); font-size:22px; letter-spacing:.04em; transform:skewX(var(--skew))}
.icon-btn{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); display:grid; place-items:center; cursor:pointer;
}
.icon-btn svg{width:22px;height:22px}
.top-right{display:flex; gap:8px; align-items:center}
.lang{display:grid; grid-template-columns:1fr 1fr; height:52px; border:2px solid var(--line); border-radius:14px; background:var(--ink); overflow:hidden}
.lang button{border:0; background:transparent; color:var(--muted); font:800 18px/1 var(--font-ui); letter-spacing:.06em; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text); color:var(--ink)}
html[lang="fr"] .tab{font-size:12px; letter-spacing:.02em}
.tab{white-space:nowrap}

/* stage */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px}
.banner{
  font-family:var(--font-display); font-size:clamp(28px,9vw,52px); line-height:1; white-space:nowrap;
  letter-spacing:.03em; transform:skewX(var(--skew)); color:var(--mode);
  text-shadow:0 3px 0 rgba(0,0,0,.6);
}
.round-info{font-size:20px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); min-height:24px}
.round-info b{color:var(--text)}

.ring{position:relative; width:min(78vw, 46vh, 360px); aspect-ratio:1; max-width:100%}
.ring svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--mode); transition:stroke-dashoffset .25s linear, stroke .4s}
.ring-inner{position:absolute; inset:0; display:grid; place-items:center}

/* fighting-game text treatment */
.fx{
  font-family:var(--font-display);
  background:linear-gradient(180deg,var(--g1) 15%,var(--g2) 55%,var(--g3) 90%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:3px var(--stroke); paint-order:stroke fill;
  transform:skewX(var(--skew));
}
.clock{font-size:min(19vw, 11vh, 92px); line-height:1; white-space:nowrap}
.clock span{display:inline-block; width:.62em; text-align:center}
.clock span.c{width:.32em}
body[data-font="iron"] .clock span{width:.72em}
body[data-font="iron"] .clock span.c{width:.34em}
.clock.warn{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:skewX(var(--skew)) scale(1.06)}}
.big-word{font-size:min(17vw, 10vh, 84px); line-height:1}

/* controls */
.controls{display:flex; flex-direction:column; gap:10px; padding-block:6px 12px; transition:opacity .25s}
.controls.locked{opacity:.35; pointer-events:none}
.label{font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-align:center}
.presets{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.chip{
  height:48px; border-radius:12px; border:2px solid var(--line); background:var(--panel);
  color:var(--text); font:800 22px/1 var(--font-ui); cursor:pointer; letter-spacing:.02em;
}
.chip[aria-pressed="true"]{border-color:var(--mode); background:color-mix(in srgb,var(--mode) 22%, var(--panel)); color:#fff}
.chip.custom{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:18px; border-style:dashed}
.chip.custom[aria-pressed="true"]{border-style:solid}
.chip.custom small{font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.chip.custom[aria-pressed="true"] small{color:var(--mode)}
.pick{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.pick-col{display:flex; flex-direction:column; align-items:center; gap:8px}
.pick-col small{font-size:13px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase}
.pick-val{font-size:64px; line-height:1; min-width:1.4em; text-align:center}
.pick-sep{font-size:56px; line-height:1}
.pick-row{display:flex; gap:10px}
.sheet-actions{display:grid; grid-template-columns:1fr 2fr; gap:10px}
.ghost{height:54px; border-radius:14px; border:2px solid var(--line); background:transparent; color:var(--text); font:800 20px/1 var(--font-ui); letter-spacing:.1em; cursor:pointer}
.ok-mode{background:var(--mode)}
.rounds{display:flex; align-items:center; justify-content:center; gap:14px}
.step{
  width:56px; height:56px; border-radius:50%; border:2px solid var(--line); background:var(--panel);
  color:var(--text); font:800 30px/1 var(--font-ui); cursor:pointer;
}
.step:active,.chip:active{transform:scale(.95)}
.rounds .num{min-width:92px; text-align:center}
.rounds .num .fx{font-size:46px; line-height:1; display:inline-block}
.rounds .num small{display:block; font-size:13px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase}

/* actions */
.actions{display:flex; gap:10px; padding-block:0 12px}
.go{
  flex:1; height:68px; border-radius:18px; border:0; cursor:pointer;
  background:var(--mode); color:#0b0a0f; font-family:var(--font-display);
  font-size:34px; letter-spacing:.06em; box-shadow:0 6px 0 color-mix(in srgb,var(--mode) 55%, #000);
  transition:background .4s;
}
.go:active{transform:translateY(3px); box-shadow:0 3px 0 color-mix(in srgb,var(--mode) 55%, #000)}
.go span{display:inline-block; transform:skewX(var(--skew))}
.reset{width:68px; height:68px; border-radius:18px; border:2px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; display:grid; place-items:center}
.reset svg{width:28px;height:28px}

/* tabs */
.tabs{
  display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  background:#09080c; border-top:1px solid var(--line);
}
.tab{
  --c:var(--muted);
  height:62px; border:0; border-radius:14px; background:transparent; cursor:pointer;
  color:var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font:800 14px/1 var(--font-ui); letter-spacing:.08em; text-transform:uppercase;
}
.tab i{width:26px; height:6px; border-radius:3px; background:var(--c); opacity:.45}
.tab[data-m="warmup"]{--c:var(--warmup)} .tab[data-m="training"]{--c:var(--training)}
.tab[data-m="rest"]{--c:var(--rest)}     .tab[data-m="stretch"]{--c:var(--stretch)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--c) 20%, transparent)}
.tab[aria-selected="true"] i{opacity:1; width:36px}
.tabs.locked .tab:not([aria-selected="true"]){opacity:.35}

button:focus-visible{outline:3px solid #fff; outline-offset:2px}

/* style sheet */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; z-index:20}
.sheet{
  width:100%; background:var(--panel); border-radius:22px 22px 0 0; border-top:1px solid var(--line);
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px;
}
.sheet h2{margin:0; font:800 15px/1 var(--font-ui); letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.font-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.font-opt{
  height:92px; border-radius:16px; border:2px solid var(--line); background:var(--ink); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted);
  font:700 13px/1 var(--font-ui); letter-spacing:.14em; text-transform:uppercase;
}
.font-opt .fx{font-size:36px; line-height:1; -webkit-text-stroke-width:1.5px}
.rounds .num .fx{-webkit-text-stroke-width:2px}
.font-opt[data-f="street"] .fx{font-family:"Bangers",Impact,sans-serif; transform:skewX(-7deg)}
.font-opt[data-f="iron"] .fx{font-family:"Russo One","Arial Black",sans-serif; transform:none; font-size:30px}
.font-opt[aria-pressed="true"]{border-color:#fff; color:var(--text)}
.swatches{display:grid; grid-template-columns:repeat(5,1fr); gap:10px}
.sw{aspect-ratio:1; max-width:100%; border-radius:14px; border:3px solid transparent; cursor:pointer; position:relative}
.sw[aria-pressed="true"]{border-color:#fff}
.sw-names{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:-8px}
.sw-names span{text-align:center; font-size:12px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.packs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.packs .chip{font-size:19px}
.sheet{max-height:92%; overflow-y:auto; -webkit-overflow-scrolling:touch}
.close{height:54px; border-radius:14px; border:0; background:var(--text); color:var(--ink); font:800 20px/1 var(--font-ui); letter-spacing:.1em; cursor:pointer}

@media (max-height:700px){
  .chip{height:42px; font-size:20px}
  .step{width:48px;height:48px}
  .rounds .num .fx{font-size:38px}
  .go,.reset{height:58px}
  .tab{height:54px}
}
@media (prefers-reduced-motion:reduce){ .clock.warn{animation:none} *{transition:none!important} }
</style>

<div class="app" id="app">
  <header class="top wrap">
    <div class="top-right">
      <button class="icon-btn" id="openStyle" data-i18n-aria="style" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main class="stage wrap">
    <div class="banner" id="banner">TRAINING</div>
    <div class="round-info" id="roundInfo"></div>
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="5"/>
        <circle class="prog" id="prog" cx="50" cy="50" r="45" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-inner"><div class="clock fx" id="clock" aria-live="off"></div></div>
    </div>
  </main>

  <section class="controls wrap" id="controls">
    <div id="roundsBox">
      <div class="rounds">
        <button class="step" id="minus" data-i18n-aria="minus" aria-label="Moins de rounds">−</button>
        <div class="num"><span class="fx" id="roundsNum">3</span><small data-i18n="rounds">rounds</small></div>
        <button class="step" id="plus" data-i18n-aria="plus" aria-label="Plus de rounds">+</button>
      </div>
    </div>
    <div class="presets" id="presets"></div>
  </section>

  <div class="actions wrap">
    <button class="reset" id="reset" data-i18n-aria="reset" aria-label="Remettre à zéro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="go" id="go"><span id="goLabel">START</span></button>
  </div>

  <nav class="tabs wrap" id="tabs" role="tablist">
    <button class="tab" role="tab" data-m="warmup"><i></i><span data-i18n="tab_warmup">Warm up</span></button>
    <button class="tab" role="tab" data-m="training"><i></i><span data-i18n="tab_training">Training</span></button>
    <button class="tab" role="tab" data-m="rest"><i></i><span data-i18n="tab_rest">Rest</span></button>
    <button class="tab" role="tab" data-m="stretch"><i></i><span data-i18n="tab_stretch">Stretching</span></button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet wrap" role="dialog" aria-label="Menu">
    <h2 data-i18n="language">Langue</h2>
    <div class="lang" id="lang" role="group" aria-label="Langue / Language">
      <button data-l="en">English</button><button data-l="fr">Français</button>
    </div>
    <h2 data-i18n="font">Police</h2>
    <div class="font-opts">
      <button class="font-opt" data-f="street"><span class="fx">FIGHT!</span>Street</button>
      <button class="font-opt" data-f="iron"><span class="fx">FIGHT!</span>Iron</button>
    </div>
    <h2 data-i18n="color">Couleur</h2>
    <div class="swatches" id="swatches"></div>
    <div class="sw-names" id="swNames"></div>
    <h2 data-i18n="sound">Sons</h2>
    <div class="packs" id="packs">
      <button class="chip" data-pack="boxe" data-i18n="s_boxe">Boxe</button>
      <button class="chip" data-pack="muscu" data-i18n="s_muscu">Muscu</button>
      <button class="chip" data-pack="sifflet" data-i18n="s_sifflet">Sifflet</button>
      <button class="chip" data-pack="arcade" data-i18n="s_arcade">Arcade</button>
      <button class="chip" data-pack="gong" data-i18n="s_gong">Gong</button>
      <button class="chip" data-pack="off" data-i18n="s_off">OFF</button>
    </div>
    <button class="close" id="closeStyle">OK</button>
  </div>
</div>

<div class="sheet-bg" id="customBg" hidden>
  <div class="sheet wrap" role="dialog" aria-label="Temps custom">
    <h2 id="customTitle">Temps custom</h2>
    <div class="pick">
      <div class="pick-col">
        <small data-i18n="min">Minutes</small>
        <span class="pick-val fx" id="cMin">0</span>
        <div class="pick-row"><button class="step" data-d="m-" aria-label="Moins une minute">−</button><button class="step" data-d="m+" aria-label="Plus une minute">+</button></div>
      </div>
      <span class="pick-sep fx">:</span>
      <div class="pick-col">
        <small data-i18n="sec">Secondes</small>
        <span class="pick-val fx" id="cSec">00</span>
        <div class="pick-row"><button class="step" data-d="s-" aria-label="Moins 5 secondes">−</button><button class="step" data-d="s+" aria-label="Plus 5 secondes">+</button></div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="ghost" id="customCancel" data-i18n="cancel">ANNULER</button>
      <button class="close ok-mode" id="customOk" data-i18n="ok">VALIDER</button>
    </div>
  </div>
</div>

<script>
(() => {
  const I18N = {
    fr: {
      n_warmup:"ÉCHAUFFEMENT", n_training:"ENTRAÎNEMENT", n_rest:"REPOS", n_stretch:"ÉTIREMENTS",
      tab_warmup:"Échauffement", tab_training:"Entraînement", tab_rest:"Repos", tab_stretch:"Étirements",
      style:"Menu", language:"Langue", reset:"Remettre à zéro", minus:"Moins de rounds", plus:"Plus de rounds",
      font:"Police", color:"Couleur", sound:"Sons", rounds:"rounds", restWord:"repos",
      next:"prochain : round", ready:"prêt ?", done:"FINI !", gg:"BIEN JOUÉ", roundsDone:"rounds terminés", finished:"terminé",
      custom:"Perso", customTime:"Temps perso", min:"Minutes", sec:"Secondes", cancel:"ANNULER", ok:"VALIDER",
      start:"START", pause:"PAUSE", resume:"REPRENDRE", again:"ENCORE",
      p_feu:"Feu", p_or:"Or", p_glace:"Glace", p_acier:"Acier", p_venin:"Venin",
      s_boxe:"Boxe", s_muscu:"Muscu", s_sifflet:"Sifflet", s_arcade:"Arcade", s_gong:"Gong", s_off:"OFF",
    },
    en: {
      n_warmup:"WARM UP", n_training:"TRAINING", n_rest:"REST", n_stretch:"STRETCHING",
      tab_warmup:"Warm up", tab_training:"Training", tab_rest:"Rest", tab_stretch:"Stretching",
      style:"Menu", language:"Language", reset:"Reset", minus:"Fewer rounds", plus:"More rounds",
      font:"Font", color:"Color", sound:"Sounds", rounds:"rounds", restWord:"rest",
      next:"next: round", ready:"ready?", done:"DONE!", gg:"GOOD JOB", roundsDone:"rounds done", finished:"finished",
      custom:"Custom", customTime:"Custom time", min:"Minutes", sec:"Seconds", cancel:"CANCEL", ok:"SET",
      start:"START", pause:"PAUSE", resume:"RESUME", again:"AGAIN",
      p_feu:"Fire", p_or:"Gold", p_glace:"Ice", p_acier:"Steel", p_venin:"Venom",
      s_boxe:"Boxing", s_muscu:"Gym", s_sifflet:"Whistle", s_arcade:"Arcade", s_gong:"Gong", s_off:"OFF",
    },
  };
  const t = k => (I18N[st.lang] || I18N.en)[k] ?? k;

  const MODES = {
    warmup:  {get name(){ return t("n_warmup"); },    color:"--warmup",   presets:[120,180,300], dur:300, custom:600, isCustom:false},
    training:{get name(){ return t("n_training"); },   color:"--training", presets:[60,120,180],  dur:180, custom:240, isCustom:false},
    rest:    {get name(){ return t("n_rest"); },       color:"--rest",     presets:[30,45,60],    dur:60,  custom:90,  isCustom:false},
    stretch: {get name(){ return t("n_stretch"); }, color:"--stretch",  presets:[120,180,300], dur:300, custom:600, isCustom:false},
  };
  const PALETTES = {
    feu:   {name:"Feu",   g:["#fff36b","#ff9a1f","#e0161f"], s:"#1a0505"},
    or:    {name:"Or",    g:["#ffffff","#ffd84a","#b8741a"], s:"#1d1203"},
    glace: {name:"Glace", g:["#ffffff","#7fe3ff","#1f5bff"], s:"#03102a"},
    acier: {name:"Acier", g:["#ffffff","#c9ccd6","#5d6170"], s:"#0c0d12"},
    venin: {name:"Venin", g:["#f4ffb0","#7dff4a","#0f9d3a"], s:"#031a08"},
  };

  const $ = id => document.getElementById(id);
  const st = {mode:"training", rounds:3, font:"street", pal:"feu", sound:true, pack:"boxe",
    lang: "en"};
  try { Object.assign(st, JSON.parse(localStorage.getItem("ringtimer")||"{}")); } catch(e){}
  try { const d = JSON.parse(localStorage.getItem("ringtimer-durs")||"{}"); for (const k in d) if (MODES[k]) MODES[k].dur = d[k]; } catch(e){}
  try { const d = JSON.parse(localStorage.getItem("ringtimer-modes")||"{}"); for (const k in d) if (MODES[k]) {
    const v = d[k]; if (v.dur>0) MODES[k].dur = v.dur; if (v.custom>0) MODES[k].custom = v.custom; MODES[k].isCustom = !!v.isCustom;
  } } catch(e){}
  const save = () => { try {
    localStorage.setItem("ringtimer", JSON.stringify(st));
    localStorage.setItem("ringtimer-modes", JSON.stringify(Object.fromEntries(Object.entries(MODES).map(([k,v])=>[k,{dur:v.dur, custom:v.custom, isCustom:v.isCustom}]))));
  } catch(e){} };

  // run state: idle | ready | running | paused | done
  let run = {state:"idle", phase:null, round:1, total:0, remain:0, endAt:0, raf:0, lastSec:-1};

  /* ---------- audio ---------- */
  let ac, master;
  const audio = () => {
    if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); master = ac.createDynamicsCompressor(); master.connect(ac.destination); } catch(e){ ac = null; } }
    if (ac && ac.state==="suspended") ac.resume();
    return ac;
  };
  // one oscillator voice: o.to = pitch glide, o.vib = vibrato rate, o.hold = sustain before decay
  function tone(freq, t0, dur, vol=.3, type="sine", o={}){
    const a = audio(); if (!a) return;
    const T = a.currentTime + t0, atk = o.atk || .005;
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, T);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, T+dur);
    if (o.vib){ const l = a.createOscillator(), lg = a.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibDepth || freq*.04; l.connect(lg).connect(osc.frequency); l.start(T); l.stop(T+dur+.05); }
    g.gain.setValueAtTime(0, T);
    g.gain.linearRampToValueAtTime(vol, T+atk);
    if (o.hold) g.gain.setValueAtTime(vol, T+atk+o.hold);
    g.gain.exponentialRampToValueAtTime(.0001, T+dur);
    osc.connect(g).connect(master); osc.start(T); osc.stop(T+dur+.05);
  }
  function noise(t0, dur, vol=.3, freq=2000, q=1){
    const a = audio(); if (!a) return;
    const T = a.currentTime+t0, n = Math.ceil(a.sampleRate*dur);
    const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); g.gain.setValueAtTime(vol, T); g.gain.exponentialRampToValueAtTime(.0001, T+dur);
    s.connect(f).connect(g).connect(master); s.start(T); s.stop(T+dur);
  }

  // Sound packs. Events: go = round starts, stop = round ends (rest), end = session over, tick = 3-2-1, warn = 10 s left
  const PACKS = {
    boxe: {
      ring(t){ [880,1320,2210,2980].forEach((f,j)=>tone(f,t,1.6-j*.3,.22/(j+1))); },
      go(){ this.ring(0); }, stop(){ this.ring(0); this.ring(.45); }, end(){ for (let i=0;i<3;i++) this.ring(i*.45); },
      tick(){ tone(760,0,.18,.3,"square"); },
      warn(){ noise(0,.07,.9,1800,2); noise(.15,.07,.9,1800,2); },
    },
    muscu: {
      buzz(t,d){ tone(180,t,d,.22,"sawtooth",{atk:.01, hold:d-.09}); tone(362,t,d,.12,"square",{atk:.01, hold:d-.09}); },
      go(){ this.buzz(0,.7); }, stop(){ this.buzz(0,.35); this.buzz(.45,.35); }, end(){ this.buzz(0,.35); this.buzz(.45,.35); this.buzz(.9,1.1); },
      tick(){ tone(1000,0,.13,.3,"sine",{hold:.07}); },
      warn(){ tone(1400,0,.09,.3,"sine",{hold:.05}); tone(1400,.13,.09,.3,"sine",{hold:.05}); },
    },
    sifflet: {
      blow(t,d){ tone(2900,t,d,.25,"sine",{atk:.02, hold:d-.08, vib:28, vibDepth:180}); noise(t,d,.06,3000,4); },
      go(){ this.blow(0,.45); }, stop(){ this.blow(0,.25); this.blow(.35,.25); }, end(){ this.blow(0,1.2); },
      tick(){ tone(2600,0,.07,.2); },
      warn(){ this.blow(0,.15); this.blow(.22,.15); },
    },
    arcade: {
      seq(notes, step){ notes.forEach((f,i)=>tone(f,i*step,step*1.6,.18,"square",{hold:step*.6})); },
      go(){ this.seq([523,659,784,1047],.08); }, stop(){ this.seq([784,659,523,392],.09); }, end(){ this.seq([523,659,784,1047,784,1047,1319],.11); },
      tick(){ tone(880,0,.08,.18,"square",{hold:.04}); },
      warn(){ tone(1319,0,.06,.15,"square"); tone(1319,.1,.06,.15,"square"); },
    },
    gong: {
      hit(t,v=1){ [[98,4],[147,3.2],[203,2.6],[276,2],[392,1.4],[523,1]].forEach(([f,d],j)=>tone(f,t,d,.3*v/(j*.6+1),"sine",{atk:.015})); noise(t,.3,.1*v,600,1); },
      go(){ this.hit(0); }, stop(){ this.hit(0,.8); this.hit(.6,.8); }, end(){ this.hit(0); this.hit(1.2); },
      tick(){ tone(950,0,.09,.35); tone(1900,0,.04,.1); },
      warn(){ this.tick(); tone(950,.14,.09,.35); tone(1900,.14,.04,.1); },
    },
  };
  const play = ev => { if (!st.sound) return; const p = PACKS[st.pack] || PACKS.boxe; p[ev](); };

  /* ---------- wake lock ---------- */
  let lock = null;
  async function keepAwake(on){
    try {
      if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null); }
      if (!on && lock) { await lock.release(); lock = null; }
    } catch(e){ lock = null; }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && run.state==="running") keepAwake(true); });

  /* ---------- render ---------- */
  const fmt = s => { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); };
  const fmtShort = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const short = s => s<60 ? s+"s" : (s%60 ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : (s/60)+" min");
  function setClock(text, cls){
    const c = $("clock");
    if (/^\d\d:\d\d$/.test(text)) c.innerHTML = [...text].map(ch => ch===":" ? '<span class="c">:</span>' : `<span>${ch}</span>`).join("");
    else c.innerHTML = `<span class="big-word" style="width:auto">${text}</span>`;
    c.className = "clock fx" + (cls ? " "+cls : "");
  }
  function setModeColor(key){ document.documentElement.style.setProperty("--mode", `var(${MODES[key].color})`); }
  function setRing(frac){ $("prog").style.strokeDashoffset = (282.74 * (1-Math.max(0,Math.min(1,frac)))).toFixed(2); }

  function renderIdle(){
    const m = MODES[st.mode];
    setModeColor(st.mode);
    $("banner").textContent = m.name;
    $("roundInfo").innerHTML = st.mode==="training"
      ? `<b>${st.rounds}</b> ${t("rounds")} · ${t("restWord")} <b>${short(MODES.rest.dur)}</b>` : "";
    setClock(fmt(m.dur)); setRing(1);
    $("roundsBox").hidden = st.mode!=="training";
    $("roundsNum").textContent = st.rounds;
    $("presets").innerHTML = m.presets.map(s =>
      `<button class="chip" data-s="${s}" aria-pressed="${!m.isCustom && s===m.dur}">${short(s)}</button>`).join("")
      + `<button class="chip custom" data-custom="1" aria-pressed="${m.isCustom}" aria-label="${t("customTime")}"><small>${t("custom")}</small>${fmtShort(m.custom)}</button>`;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.m===st.mode));
  }
  function renderLock(){
    const busy = run.state!=="idle";
    $("controls").classList.toggle("locked", busy);
    $("tabs").classList.toggle("locked", busy);
    $("goLabel").textContent = t(run.state==="running"||run.state==="ready" ? "pause" : run.state==="paused" ? "resume" : run.state==="done" ? "again" : "start");
  }

  /* ---------- engine ---------- */
  function startPhase(phase, secs){
    run.phase = phase; run.total = secs; run.remain = secs; run.endAt = performance.now() + secs*1000; run.lastSec = -1;
    const key = phase==="work" ? st.mode : phase==="rest" ? "rest" : st.mode;
    setModeColor(key);
    if (st.mode==="training"){
      $("banner").textContent = phase==="rest" ? MODES.rest.name : `ROUND ${run.round}`;
      $("roundInfo").innerHTML = phase==="rest" ? `${t("next")} <b>${run.round+1}</b> / ${st.rounds}` : `round <b>${run.round}</b> / ${st.rounds}`;
    } else {
      $("banner").textContent = MODES[st.mode].name; $("roundInfo").innerHTML = "";
    }
  }
  function tick(){
    if (run.state!=="running") return;
    run.remain = (run.endAt - performance.now())/1000;
    const sec = Math.ceil(run.remain);
    if (sec !== run.lastSec){
      run.lastSec = sec;
      if (run.phase==="ready"){ if (sec>0){ setClock(String(sec)); play("tick"); } }
      else {
        setClock(fmt(run.remain), sec<=10 && sec>0 ? "warn" : "");
        if (sec===10 && run.total>20) play("warn");
        if (sec<=3 && sec>0) play("tick");
      }
    }
    if (run.phase!=="ready") setRing(run.remain/run.total);
    if (run.remain<=0){ next(); }
    run.raf = requestAnimationFrame(tick);
  }
  function next(){
    if (run.phase==="ready"){
      setClock("FIGHT!"); play("go");
      startPhase("work", MODES[st.mode].dur);
      return;
    }
    if (st.mode==="training" && run.phase==="work" && run.round < st.rounds){
      play("stop"); startPhase("rest", MODES.rest.dur); return;
    }
    if (st.mode==="training" && run.phase==="rest"){
      run.round++; play("go"); startPhase("work", MODES.training.dur); return;
    }
    finish();
  }
  function finish(){
    play("end");
    run.state = "done"; cancelAnimationFrame(run.raf); keepAwake(false);
    setRing(0); setClock(st.mode==="training" ? "K.O.!" : t("done"));
    $("banner").textContent = st.mode==="training" ? t("gg") : MODES[st.mode].name;
    $("roundInfo").innerHTML = st.mode==="training" ? `<b>${st.rounds}</b> ${t("roundsDone")}` : t("finished");
    renderLock();
  }
  function go(){
    audio();
    if (run.state==="idle" || run.state==="done"){
      run = {state:"running", phase:null, round:1, total:0, remain:0, endAt:0, raf:0, lastSec:-1};
      run.phase = "ready"; run.total = 3; run.endAt = performance.now()+3000;
      setModeColor(st.mode); setRing(1);
      $("banner").textContent = st.mode==="training" ? "ROUND 1" : MODES[st.mode].name;
      $("roundInfo").innerHTML = t("ready");
      keepAwake(true); run.raf = requestAnimationFrame(tick);
    } else if (run.state==="running"){
      run.state = "paused"; run.remain = (run.endAt-performance.now())/1000; cancelAnimationFrame(run.raf); keepAwake(false);
    } else if (run.state==="paused"){
      run.state = "running"; run.endAt = performance.now()+run.remain*1000; run.lastSec = -1; keepAwake(true); run.raf = requestAnimationFrame(tick);
    }
    renderLock();
  }
  function reset(){
    cancelAnimationFrame(run.raf); keepAwake(false);
    run = {state:"idle", phase:null, round:1, total:0, remain:0, endAt:0, raf:0, lastSec:-1};
    renderIdle(); renderLock();
  }

  /* ---------- style ---------- */
  function applyStyle(){
    const p = PALETTES[st.pal] || PALETTES.feu, r = document.documentElement.style;
    r.setProperty("--g1",p.g[0]); r.setProperty("--g2",p.g[1]); r.setProperty("--g3",p.g[2]); r.setProperty("--stroke",p.s);
    document.body.dataset.font = st.font;
    document.querySelectorAll(".font-opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.f===st.font));
    document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", b.dataset.p===st.pal));
    document.querySelectorAll("#packs .chip").forEach(b => b.setAttribute("aria-pressed",
      b.dataset.pack==="off" ? !st.sound : (st.sound && b.dataset.pack===st.pack)));
  }
  $("swatches").innerHTML = Object.entries(PALETTES).map(([k,p]) =>
    `<button class="sw" data-p="${k}" aria-label="${p.name}" style="background:linear-gradient(180deg,${p.g[0]},${p.g[1]} 50%,${p.g[2]})"></button>`).join("");
  function applyLang(){
    document.documentElement.lang = st.lang;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    $("swNames").innerHTML = Object.keys(PALETTES).map(k => `<span>${t("p_"+k)}</span>`).join("");
    document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-label", t("p_"+b.dataset.p)));
    document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===st.lang));
    if (run.state==="idle") renderIdle();
    renderLock();
  }
  $("lang").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st.lang = b.dataset.l; save(); applyLang();
  });

  /* ---------- events ---------- */
  $("go").addEventListener("click", go);
  $("reset").addEventListener("click", reset);
  $("tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t || run.state!=="idle") return;
    st.mode = t.dataset.m; save(); renderIdle();
  });
  $("presets").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const m = MODES[st.mode];
    if (b.dataset.custom) { openCustom(); return; }
    m.dur = +b.dataset.s; m.isCustom = false; save(); renderIdle();
  });

  /* ---------- custom time picker ---------- */
  let cMin = 0, cSec = 0;
  function drawCustom(){ $("cMin").textContent = cMin; $("cSec").textContent = String(cSec).padStart(2,"0"); }
  function openCustom(){
    const m = MODES[st.mode];
    cMin = Math.floor(m.custom/60); cSec = m.custom%60;
    $("customTitle").textContent = t("customTime") + " · " + m.name;
    drawCustom(); $("customBg").hidden = false;
  }
  function bump(d){
    if (d==="m+") cMin = Math.min(60, cMin+1);
    if (d==="m-") cMin = Math.max(0, cMin-1);
    if (d==="s+") { cSec += 5; if (cSec>=60) { cSec = 0; if (cMin<60) cMin++; } }
    if (d==="s-") { cSec -= 5; if (cSec<0) { if (cMin>0) { cMin--; cSec = 55; } else cSec = 0; } }
    if (cMin===60) cSec = 0;
    drawCustom();
  }
  // tap = one step, hold = fast repeat
  let holdT = 0, holdI = 0;
  const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); };
  document.querySelectorAll("#customBg [data-d]").forEach(b => {
    b.addEventListener("pointerdown", e => { e.preventDefault(); bump(b.dataset.d); stopHold(); holdT = setTimeout(() => { holdI = setInterval(() => bump(b.dataset.d), 90); }, 400); });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, stopHold));
  });
  $("customCancel").addEventListener("click", () => { $("customBg").hidden = true; });
  $("customBg").addEventListener("click", e => { if (e.target.id==="customBg") $("customBg").hidden = true; });
  $("customOk").addEventListener("click", () => {
    const total = Math.max(5, cMin*60 + cSec);
    const m = MODES[st.mode]; m.custom = total; m.dur = total; m.isCustom = true;
    save(); renderIdle(); $("customBg").hidden = true;
  });
  $("minus").addEventListener("click", () => { st.rounds = Math.max(1, st.rounds-1); save(); renderIdle(); });
  $("plus").addEventListener("click", () => { st.rounds = Math.min(20, st.rounds+1); save(); renderIdle(); });
  $("openStyle").addEventListener("click", () => { $("sheetBg").hidden = false; });
  $("closeStyle").addEventListener("click", () => { $("sheetBg").hidden = true; });
  $("sheetBg").addEventListener("click", e => { if (e.target.id==="sheetBg") $("sheetBg").hidden = true; });
  document.querySelector(".font-opts").addEventListener("click", e => { const b = e.target.closest(".font-opt"); if (!b) return; st.font = b.dataset.f; save(); applyStyle(); });
  $("swatches").addEventListener("click", e => { const b = e.target.closest(".sw"); if (!b) return; st.pal = b.dataset.p; save(); applyStyle(); });
  $("packs").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.dataset.pack==="off") st.sound = false;
    else { st.sound = true; st.pack = b.dataset.pack; play("go"); }
    save(); applyStyle();
  });

  applyStyle(); applyLang();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
