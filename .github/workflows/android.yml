name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RingTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RingTimer-apk
          path: RingTimer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Ring Timer for Android 1.0.${{ github.run_number }}
          body: |
            Download **RingTimer.apk** below and open it on your Android phone to install.
            If Android asks, allow installing apps from your browser or file manager.
          files: RingTimer.apk
          make_latest: true
